<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width,initial-scale=1" charset="UTF-8">

<head>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box
    }

    #brandCard {
      width: 100%;
      height: 100%;
      background-color: #fff;
      align-items: center;
      justify-content: center;
      display: flex;
      box-sizing: border-box;
      flex-flow: column wrap;
      position: absolute
    }

    body {
      background-color: #fff;
      height: 100%;
      width: 100%;
      padding: 20px;
      font-family: Arial, Helvetica, Sans-Serif
    }

    html {
      background-color: #f4f4f4;
      height: 100%
    }

    #content {
      width: 100%;
      height: 100%;
      position: fixed;
      overflow: hidden;
      margin: 0 auto
    }

    .brandLoader {
      height: 100%;
      width: 100%;
      display: flex;
      box-sizing: border-box;
      flex-flow: column wrap;
      background-color: #404040;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      flex: 0 0 auto
    }

    .statement {
      font-size: 14px;
      font-family: system-ui;
      color: #444;
      margin-top: 24px
    }

    #loading {
      width: 48px;
      height: 48px;
      viewbox: 0 0 16 16;
      -webkit-animation: rotation 1.8s infinite linear
    }

    @-webkit-keyframes rotation {
      from {
        -webkit-transform: rotate(0deg)
      }

      to {
        -webkit-transform: rotate(359deg)
      }
    }

    #brandingText {
      width: auto;
      height: 14px;
      margin-top: 16px
    }
  </style>
</head>

<body>

  <!-- Visa device profiling iframe (hidden) -->
  <iframe id="vpp-iframe" style="visibility:hidden" width="0" height="0"
    allow="payment *; publickey-credentials-get *; publickey-credentials-create *"
    referrerpolicy="strict-origin-when-cross-origin"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals">
  </iframe>

  <div class="brandLoader" id="brandLoader">
    <div id="brandCard">

      <div id="brandingText" class="brandingText"><span style="font-weight:700">JUSPAY</span> Safe</div>
    </div>
  </div>

  <form action="ENDPOINT_URL" method="GET">
    BANK_INFO_FORM_INPUTS
    <input name="encDeviceInformation" type="hidden" value='{"javaScriptEnabled":false}' />
    <input name="passkeySupported" type="hidden" value="false" />
    <input name="passkeySupportLog" type="hidden" value="" />
    <input name="encVersion" type="hidden" value="1" />
    <input name="fallback" type="hidden" value="FALLBACK_VAL" />
    <input name="otpWaitPage" type="hidden" value="OTP_WAIT_PAGE_VAL" />
    <input name="tokenize" type="hidden" value="TOKENIZE_VAL" />
    <!-- Visa fields injected by JS -->
    <input name="visaServerStateToken" type="hidden" value="" />
    <input name="visaPasskeyIntialiazationError" type="hidden" value="" />
    <button type="submit">{{SUBMIT_BUTTON_TEXT}}</button>
  </form>

  <script>
    (function () {
      var VISA_BASE = "https://sandbox.auth.visa.com";
      var VISA_INIT_URL = VISA_BASE + "/oauth2/authorization/request/hub#msg=";
      var RETURN_URL = "https://weak-tova-ungently.ngrok-free.dev/passkey/redirection";
      var RETURN_URL_HOST = "https://weak-tova-ungently.ngrok-free.dev";
      var VISA_TIMEOUT_MS = 5000;
      var hasSubmitted = false;
      var serverStateToken = null;
      var fingerprintDone = false;
      var deviceProfilingDone = false;
      var visaTimeoutRef = null;

      function setInput(name, value) {
        var el = document.querySelector("[name=" + name + "]");
        if (el) el.value = value;
      }

      function submitForm() {
        if (hasSubmitted) return;
        hasSubmitted = true;
        clearTimeout(visaTimeoutRef);
        var form = document.querySelector("form");
        if (form) form.submit();
      }

      function submitWithError(passkeyResult, errorCode, errorMessage) {
        if (hasSubmitted) return;
        setInput("visaPasskeyIntialiazationError", window.btoa(JSON.stringify({
          passkeyResult: passkeyResult,
          errorCode: errorCode,
          errorMessage: errorMessage
        })));
        submitForm();
      }

      function trySubmitForm() {
        if (hasSubmitted) return;
        if (!fingerprintDone || !serverStateToken || !deviceProfilingDone) return;
        setInput("visaServerStateToken", serverStateToken);
        submitForm();
      }

      visaTimeoutRef = setTimeout(function () {
        submitWithError("PASSKEY_IFRAME__INITIALIZATION_TIMEOUT", "PASSKEY_IFRAME__INITIALIZATION_TIMEOUT", "Visa iframe did not respond within " + (VISA_TIMEOUT_MS / 1000) + "s");
      }, VISA_TIMEOUT_MS);

      try {
        var INIT_COMMAND = {
          type: "COMMAND",
          ref: crypto.randomUUID(),
          ts: Date.now(),
          command: {
            type: "INITIALIZATION",
            data: {
              response_mode: "com_visa_web_message",
              redirect_uri: RETURN_URL,
              session_context: {
                apn: "vdp-web",
                client_software: {
                  top_origin: RETURN_URL_HOST,
                  integrator_origin: RETURN_URL_HOST,
                  uebas: [{ source: "VDI", ref: crypto.randomUUID() }],
                  id: "VDPW",
                  version: "24.07",
                  oauth2_version: "1.0",
                  tenancy: { product_code: "VDP" }
                }
              }
            },
            response_type: "urn:ext:oauth:response-type:server_state"
          }
        };
        var iframe = document.getElementById("vpp-iframe");
        if (!iframe) throw new Error("vpp-iframe element not found in DOM");
        iframe.src = VISA_INIT_URL + encodeURIComponent(JSON.stringify(INIT_COMMAND));
      } catch (e) {
        submitWithError(
          "PASSKEY_IFRAME__INITIALIZATION_ERROR",
          "PASSKEY_IFRAME__INITIALIZATION_ERROR",
          "Failed to initialize Visa iframe: " + e.message
        );
      }

      window.addEventListener("message", function (event) {
        if (hasSubmitted) return;
        var msg;
        try {
          msg = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
        } catch (e) {
          return;
        }
        if (!msg || typeof msg !== "object") return;

        if (msg.type === "RESULT" && msg.result && msg.result.command_type === "INITIALIZATION") {
          if (msg.result.status === "SUCCESS") {
            try {
              var token = msg.result.data.tokens[0].token;
              if (!token) throw new Error("token is empty");
              serverStateToken = token;
              trySubmitForm();
            } catch (e) {
              submitWithError(
                "PASSKEY_INITIALIZATION_FAILED",
                "PASSKEY_INITIALIZATION_FAILED",
                "Failed to extract serverStateToken: " + e.message
              );
            }
          } else {
            var initErrCode = (msg.result.data && (
              (msg.result.data.error_details && msg.result.data.error_details.error) ||
              msg.result.data.error
            )) || "PASSKEY_INITIALIZATION_FAILED";
            var initErrDesc = (msg.result.data && (
              (msg.result.data.error_details && msg.result.data.error_details.error_description) ||
              msg.result.data.error_description
            )) || "Visa passkey initialization returned failure status";
            submitWithError("PASSKEY_INITIALIZATION_FAILED", initErrCode, initErrDesc);
          }
        }

        if (msg.type === "EVENT" && msg.event && msg.event.type === "DEVICE_DATA_CAPTURED") {
          deviceProfilingDone = true;
          trySubmitForm();
        }

        if (msg.type === "EVENT" && msg.event && msg.event.type === "DEVICE_DATA_CAPTURE_FAILED") {
          var dpErrCode = (msg.result && msg.result.data && (
            (msg.result.data.error_details && msg.result.data.error_details.error) ||
            msg.result.data.error
          )) || "PASSKEY_DEVICE_DATA_CAPTURE_FAILED";
          var dpErrDesc = (msg.result && msg.result.data && (
            (msg.result.data.error_details && msg.result.data.error_details.error_description) ||
            msg.result.data.error_description
          )) || "Visa device data capture failed";
          submitWithError("PASSKEY_DEVICE_DATA_CAPTURE_FAILED", dpErrCode, dpErrDesc);
        }
      });

      function looksLikeWebView() {
        if (new URLSearchParams(window.location.search).get("passkeyClient") === "WEBVIEW")
          return { isWebView: false, reason: "ALLOW_WEBVIEW" };
        var ua = navigator.userAgent || "";
        if (!ua) return { isWebView: true, reason: "No user agent" };
        if (/; wv\)/i.test(ua)) return { isWebView: true, reason: "Android WebView heuristic matched " + ua };
        if (/Android/i.test(ua) && typeof navigator.permissions === "undefined")
          return { isWebView: true, reason: "Android permissions API missing" };
        var isAndroid = /Android/i.test(ua);
        var hasPush = "PushManager" in window;
        var swShowNotif = typeof window.ServiceWorkerRegistration !== "undefined" &&
          "showNotification" in window.ServiceWorkerRegistration.prototype;
        if (isAndroid && (!hasPush || !swShowNotif))
          return { isWebView: true, reason: "Android Push or ServiceWorkerNotification missing" };
        var isIOS = /iPad|iPhone|iPod/.test(ua);
        var isSafari = /Safari/.test(ua);
        var isCriOS = /CriOS/.test(ua);
        var isFxiOS = /FxiOS/.test(ua);
        if (isIOS && !isSafari && !isCriOS && !isFxiOS)
          return { isWebView: true, reason: "iOS WebView heuristic matched " + ua };
        return { isWebView: false, reason: "No heuristics matched " + ua };
      }

      function supportsPasskeys(cb) {
        try {
          var webviewCheck = looksLikeWebView();
          if (webviewCheck.isWebView) { cb({ passkeyOk: false, reason: webviewCheck.reason }); return; }
          if (!window.PublicKeyCredential) { cb({ passkeyOk: false, reason: "No PublicKeyCredential" }); return; }
          if (!navigator.credentials) { cb({ passkeyOk: false, reason: "No navigator.credentials" }); return; }
          if (typeof navigator.credentials.create !== "function") { cb({ passkeyOk: false, reason: "No navigator.credentials.create" }); return; }
          if (typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable !== "function") { cb({ passkeyOk: false, reason: "No isUserVerifyingPlatformAuthenticatorAvailable" }); return; }
          var p = PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          if (!p || typeof p.then !== "function") { cb({ passkeyOk: false, reason: "No Promise returned" }); return; }
          p.then(function (ok) { cb({ passkeyOk: !!ok, reason: webviewCheck.reason }); })
            .catch(function (e) { cb({ passkeyOk: false, reason: "Exception: " + e.message }); });
        } catch (e) {
          cb({ passkeyOk: false, reason: "Exception: " + e.message });
        }
      }

      var btn = document.querySelector("button");
      if (btn) btn.style.display = "none";
      supportsPasskeys(function (passkeyOk) {
        try {
          var deviceInfo = {
            colourDepth: screen.colorDepth,
            javaEnabled: navigator.javaEnabled ? navigator.javaEnabled() : false,
            javaScriptEnabled: true,
            language: navigator.language,
            screenHeight: screen.height,
            screenWidth: screen.width,
            screenAvailWidth: screen.availWidth,
            screenAvailHeight: screen.availHeight,
            timeZone: new Date().getTimezoneOffset(),
            cookieEnabled: navigator.cookieEnabled,
            userAgent: navigator.userAgent,
            deviceMemory: navigator.deviceMemory || null,
            plugins: (function () { try { return Array.from(navigator.plugins).map(function (p) { return p.name; }).join(", "); } catch (e) { return null; } })(),
            mimeTypes: (function () { try { return Array.from(navigator.mimeTypes).map(function (m) { return m.type; }).join(", "); } catch (e) { return null; } })(),
            doNotTrack: (function () { try { return navigator.doNotTrack; } catch (e) { return null; } })(),
            maxTouchPoints: (function () { try { return navigator.maxTouchPoints; } catch (e) { return null; } })(),
            hardWareConcurrency: (function () { try { return navigator.hardwareConcurrency; } catch (e) { return null; } })(),
            platform: (function () { try { return navigator.platform; } catch (e) { return null; } })(),
            vendor: (function () { try { return navigator.vendor; } catch (e) { return null; } })()
          };
          setInput("encDeviceInformation", window.btoa(JSON.stringify(deviceInfo)));
          setInput("passkeySupported", passkeyOk.passkeyOk ? "true" : "false");
          setInput("passkeySupportLog", btoa(passkeyOk.reason));
        } catch (e) {
          // Fingerprint collection failed — record the error but still proceed
          // so the Visa gate can still function
          setInput("encDeviceInformation", window.btoa(JSON.stringify({ error: e.message })));
        }

        fingerprintDone = true;
        trySubmitForm();
      });

    })();
  </script>
</body>

</html>
